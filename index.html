  // tickets créés avec l'ancienne version (gardés seulement dans le navigateur) : envoyés une seule fois dans la base
  (function migrate(){const old=ls.get(OLD,null);if(!Array.isArray(old)||!old.length)return;
    old.forEach(o=>{if(o&&o.desc){const t={...o,id:uuid()};queue.push({op:'insert',row:toRow(t)});if(o.status&&o.status!=='todo')queue.push({op:'update',id:t.id,patch:{statut:o.status}})}});
    try{localStorage.removeItem(OLD)}catch(e){} keep();})();
  const fmt=iso=>{if(!iso)return '';const d=new Date(iso);return d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})};

  /* ---------- page et endroit en cours ---------- */
  const routeKey=()=>((location.hash||'#accueil').slice(1).split('?')[0]||'accueil');
  function label(k){
    try{ if(typeof PAGES==='object'&&PAGES[k]) return 'Séance '+(PAGES[k].kicker||k).toLowerCase(); }catch(e){}
    try{ const a=(JOURNAL||[]).find(x=>x.id===k); if(a) return 'Journal · '+a.title; }catch(e){}
    return NAMES[k]||k;
  }
  function pageKeys(){
    let ks=[];try{ks=ROUTES().filter(k=>k!=='404')}catch(e){ks=Object.keys(NAMES)}
    return [...new Set(ks)];
  }
  function currentKey(){const k=routeKey();return pageKeys().includes(k)?k:'accueil'}
  function section(){
    const H=innerHeight, el=document.elementFromPoint(innerWidth/2,H*.45);
    const zones=[['.h-hero','Photo d\'ouverture'],['.h-breath','Photo pleine largeur'],['.h-sel','Sélection de photos'],['.p-gallery','Galerie photos'],['footer','Pied de page']];
    if(el) for(const [s,l] of zones) if(el.closest(s)) return l;
    let best='';
    document.querySelectorAll('#app h1, #app h2, #app h3').forEach(h=>{
      const r=h.getBoundingClientRect(); if(!r.height||h.closest('.dessous')) return;
      if(r.top<H*.6) best=(h.getAttribute('aria-label')||h.textContent).replace(/\s+/g,' ').trim();
    });
    return best||(scrollY<innerHeight*.5?'Haut de page':'');
  }
  const device=()=>(innerWidth<900?'Téléphone':'Ordinateur')+' · '+innerWidth+' px';

  /* ---------- styles ---------- */
  const css=`
.rt-fab{position:fixed;right:16px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:45;width:56px;height:56px;border-radius:50%;border:0;background:#2B2622;color:#FBF8F2;font:300 32px/1 system-ui,sans-serif;display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 28px rgba(43,38,34,.32);transition:transform .25s ease,box-shadow .25s ease}
.rt-fab:hover{transform:translateY(-2px) rotate(90deg);box-shadow:0 14px 34px rgba(43,38,34,.38)}
.rt-fab:focus-visible{outline:3px solid #8A6A4F;outline-offset:3px}
.rt-fab .rt-badge{position:absolute;top:-2px;right:-2px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#A3352A;color:#fff;font:600 12px/22px system-ui,sans-serif}
.rt-fab .rt-badge:empty{display:none}
.rt-tip{position:fixed;right:84px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:45;background:#2B2622;color:#FBF8F2;font:500 13px system-ui,sans-serif;padding:7px 12px;border-radius:20px;pointer-events:none;opacity:0;transform:translateX(6px);transition:.25s}
.rt-fab:hover+.rt-tip{opacity:1;transform:none}
@media (min-width:900px){.rt-fab{right:28px;bottom:28px}.rt-tip{right:96px;bottom:42px}}
.rt-dlg{border:0;padding:0;border-radius:18px;width:min(560px,calc(100% - 20px));max-height:calc(100% - 20px);background:#FBF8F2;color:#2B2622;box-shadow:0 30px 80px rgba(0,0,0,.3);font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.rt-dlg::backdrop{background:rgba(43,38,34,.45);backdrop-filter:blur(2px)}
.rt-dlg form{display:grid;gap:14px;padding:22px}
.rt-dlg h2{font:400 26px/1.15 Newsreader,Georgia,serif;margin:0}
.rt-dlg p.rt-sub{margin:-6px 0 0;color:#6B625A;font-size:13px}
.rt-dlg label{display:grid;gap:6px;font-size:13px;font-weight:600}
.rt-dlg input,.rt-dlg select,.rt-dlg textarea{font:400 16px/1.4 system-ui,sans-serif;color:#2B2622;background:#fff;border:1px solid #D8CDBE;border-radius:10px;padding:10px 12px;width:100%;box-sizing:border-box}
.rt-dlg textarea{min-height:130px;resize:vertical}
.rt-dlg input:focus,.rt-dlg select:focus,.rt-dlg textarea:focus{outline:2px solid #8A6A4F;outline-offset:1px}
.rt-types{display:flex;flex-wrap:wrap;gap:8px;border:0;margin:0;padding:0}
.rt-types legend{font-size:13px;font-weight:600;margin-bottom:6px;padding:0;width:100%}
.rt-types label{display:inline-flex;font-weight:500}
.rt-types input{position:absolute;opacity:0;width:1px;height:1px}
.rt-types label span{border:1px solid #D8CDBE;border-radius:20px;padding:7px 13px;background:#fff;cursor:pointer;min-height:20px}
.rt-types input:checked+span{background:#2B2622;color:#FBF8F2;border-color:#2B2622}
.rt-types input:focus-visible+span{outline:2px solid #8A6A4F;outline-offset:2px}
.rt-meta{font-size:12px;color:#6B625A}
.rt-err{color:#A3352A;font-size:13px;margin:0}
.rt-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center}
.rt-btn{font:500 14px system-ui,sans-serif;border-radius:24px;padding:11px 18px;min-height:44px;cursor:pointer;border:1px solid #2B2622;background:#2B2622;color:#FBF8F2}
.rt-btn.ghost{background:transparent;color:#2B2622;border-color:#D8CDBE}
.rt-btn.small{padding:7px 12px;min-height:36px;font-size:13px}
.rt-btn.danger{background:transparent;color:#A3352A;border-color:#E3C2BC}
.rt-toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);z-index:100;background:#2B2622;color:#FBF8F2;font:500 14px system-ui,sans-serif;padding:12px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:.3s;width:max-content;max-width:calc(100vw - 24px);white-space:nowrap}
.rt-toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.rt-toast button{background:none;border:0;color:#E9C9A5;font:600 14px system-ui,sans-serif;text-decoration:underline;cursor:pointer;padding:6px}
.rt-panel{width:min(980px,100%);height:100%;max-height:100%;max-width:100%;border-radius:0;margin:0 0 0 auto}
@media (min-width:900px){.rt-panel{height:calc(100% - 40px);max-height:calc(100% - 40px);border-radius:18px;margin:20px auto}}
.rt-panel .rt-in{display:flex;flex-direction:column;height:100%}
.rt-head{padding:18px 20px 14px;border-bottom:1px solid #E5DBCD;display:grid;gap:10px}
.rt-head .rt-top{display:flex;justify-content:space-between;align-items:start;gap:12px}
.rt-note{background:#EFE2BF;border:1px dashed #8A6A4F;border-radius:10px;padding:8px 12px;font-size:13px;margin:0}
.rt-warn{background:#F6D9D3;border-color:#A3352A}
.rt-filters{display:flex;flex-wrap:wrap;gap:6px}
.rt-filters button{font:500 13px system-ui,sans-serif;border:1px solid #D8CDBE;background:#fff;border-radius:20px;padding:7px 12px;cursor:pointer;min-height:36px}
.rt-filters button[aria-pressed="true"]{background:#2B2622;color:#FBF8F2;border-color:#2B2622}
.rt-actions{display:flex;flex-wrap:wrap;gap:8px}
.rt-list{flex:1;overflow:auto;padding:14px 20px 30px;display:grid;gap:12px;align-content:start;-webkit-overflow-scrolling:touch}
.rt-card{background:#fff;border:1px solid #E5DBCD;border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.rt-card.done{opacity:.6}
.rt-card .rt-l1{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;font-size:12px;color:#6B625A}
.rt-card .rt-num{font:600 13px system-ui,sans-serif;color:#2B2622}
.rt-card .rt-pg{font-weight:600;color:#2B2622}
.rt-chip{border-radius:12px;padding:2px 8px;background:#F1EAE0;font-size:12px;color:#2B2622}
.rt-card .rt-desc{white-space:pre-wrap;font-size:15px;margin:0}
.rt-card .rt-l3{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rt-card select{font:500 13px system-ui,sans-serif;border:1px solid #D8CDBE;border-radius:18px;padding:6px 10px;background:#fff;min-height:36px}
.rt-empty{text-align:center;color:#6B625A;padding:50px 10px}
.rt-tab b{font-style:normal}
.rt-count{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:#A3352A;color:#fff;font:600 11px/18px system-ui,sans-serif;text-align:center;vertical-align:1px}
.rt-count:empty{display:none}`;
  const st=document.createElement('style');st.textContent=css;document.head.appendChild(st);

  /* ---------- bouton + ---------- */
  const fab=document.createElement('button');
  fab.type='button';fab.className='rt-fab';fab.setAttribute('aria-label',"Créer un ticket d'amélioration");
  fab.innerHTML='<span aria-hidden="true">+</span><span class="rt-badge" aria-hidden="true"></span>';
  const tip=document.createElement('span');tip.className='rt-tip';tip.textContent='Une remarque ?';tip.setAttribute('aria-hidden','true');
  document.body.append(fab,tip);

  /* ---------- formulaire de ticket ---------- */
  const dlg=document.createElement('dialog');dlg.className='rt-dlg';dlg.setAttribute('aria-labelledby','rt-t');
  dlg.innerHTML=`<form method="dialog" novalidate>
    <h2 id="rt-t">Nouveau ticket d'amélioration</h2>
    <p class="rt-sub">Notez ce que vous voulez changer, ajouter ou corriger. Tout est enregistré dans l'onglet « Retours ».</p>
    <label>Page<select id="rt-page"></select></label>
    <label>Endroit dans la page <span style="font-weight:400;color:#6B625A">(facultatif)</span><input id="rt-where" type="text" autocomplete="off" placeholder="Ex. : la photo du haut, le 2e paragraphe…"></label>
    <fieldset class="rt-types"><legend>Type <span style="font-weight:400;color:#6B625A">(facultatif)</span></legend>${TYPES.map(t=>`<label><input type="radio" name="rt-type" value="${t}"><span>${t}</span></label>`).join('')}</fieldset>
    <label>Description<textarea id="rt-desc" required placeholder="Ce que je voudrais : …"></textarea></label>
    <p class="rt-err" id="rt-err" hidden>Ajoutez une description avant d'enregistrer.</p>
    <p class="rt-meta" id="rt-meta"></p>
    <div class="rt-row"><button type="button" class="rt-btn ghost" id="rt-cancel">Annuler</button><button type="submit" class="rt-btn" id="rt-save">Enregistrer le ticket</button></div>
  </form>`;
  document.body.appendChild(dlg);
  let editing=null;
  function openForm(t){
    editing=t||null;
    const keys=pageKeys(), cur=t?t.page:currentKey();
    const opts=keys.map(k=>`<option value="${esc(k)}"${k===cur?' selected':''}>${esc(label(k))}</option>`);
    opts.push(`<option value="general"${cur==='general'?' selected':''}>Tout le site / général</option>`);
    if(t&&!keys.includes(t.page)&&t.page!=='general') opts.unshift(`<option value="${esc(t.page)}" selected>${esc(t.pageLabel||t.page)}</option>`);
    $('#rt-page').innerHTML=opts.join('');
    $('#rt-where').value=t?t.where||'':section();
    $('#rt-desc').value=t?t.desc:'';
    dlg.querySelectorAll('input[name="rt-type"]').forEach(r=>r.checked=!!t&&r.value===t.type);
    $('#rt-err').hidden=true;
    $('#rt-t').textContent=t?`Modifier le ticket ${t.num}`:"Nouveau ticket d'amélioration";
    $('#rt-save').textContent=t?'Enregistrer les modifications':'Enregistrer le ticket';
    $('#rt-meta').textContent=t?`Créé le ${fmt(t.created)} · ${t.device}`:`Appareil : ${device()} · date et heure ajoutées automatiquement`;
    dlg.showModal();
    setTimeout(()=>$('#rt-desc').focus(),30);
  }
  $('#rt-cancel').addEventListener('click',()=>dlg.close());
  dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
  dlg.querySelector('form').addEventListener('submit',e=>{
    e.preventDefault();
    const desc=$('#rt-desc').value.trim();
    if(!desc){$('#rt-err').hidden=false;$('#rt-desc').focus();return}
    const page=$('#rt-page').value, type=(dlg.querySelector('input[name="rt-type"]:checked')||{}).value||'';
    const pageLabel=page==='general'?'Tout le site':label(page), where=$('#rt-where').value.trim();
    if(editing){
      updateTicket(editing.id,{page,pageLabel,where,type,desc});
      dlg.close();renderPanel();toast(`Ticket ${editing.num} modifié`);
    }else{
      createTicket({created:new Date().toISOString(),page,pageLabel,where,type,desc,device:device(),status:'todo'});
      dlg.close();renderPanel();toast('Ticket enregistré',true);
    }
  });
  fab.addEventListener('click',()=>openForm());

  /* ---------- message de confirmation ---------- */
  const tst=document.createElement('div');tst.className='rt-toast';tst.setAttribute('role','status');document.body.appendChild(tst);
  let tt;
  function toast(msg,link){
    tst.innerHTML=esc(msg)+(link?' <button type="button">Voir mes retours</button>':'');
    if(link) tst.querySelector('button').onclick=()=>{tst.classList.remove('on');openPanel()};
    tst.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>tst.classList.remove('on'),4200);
  }

  /* ---------- onglet Retours ---------- */
  const pnl=document.createElement('dialog');pnl.className='rt-dlg rt-panel';pnl.setAttribute('aria-labelledby','rt-pt');
  pnl.innerHTML=`<div class="rt-in">
    <div class="rt-head">
      <div class="rt-top"><div><h2 id="rt-pt">Retours</h2><p class="rt-meta" id="rt-sum" style="margin:2px 0 0"></p></div><button type="button" class="rt-btn ghost small" id="rt-close">Fermer</button></div>
      <p class="rt-note">Onglet de relecture : il sera supprimé avant la mise en ligne du site. Les tickets sont partagés : tout le monde voit la même liste.</p>
      <p class="rt-meta" id="rt-sync" aria-live="polite"></p>
      <div class="rt-filters" id="rt-filters" role="group" aria-label="Filtrer les tickets"></div>
      <div class="rt-actions">
        <button type="button" class="rt-btn small" id="rt-new">+ Nouveau ticket</button>
        <button type="button" class="rt-btn ghost small" id="rt-ref">Actualiser</button>
        <button type="button" class="rt-btn ghost small" id="rt-copy">Copier le texte</button>
        <button type="button" class="rt-btn ghost small" id="rt-dl">Télécharger le fichier</button>
        <button type="button" class="rt-btn ghost small" id="rt-imp">Importer un fichier</button>
        <input type="file" id="rt-file" accept=".json,application/json" hidden>
      </div>
    </div>
    <div class="rt-list" id="rt-list"></div>
  </div>`;
  document.body.appendChild(pnl);
  let filter='all';
  function renderPanel(){
    if(!pnl.open) return;
    const l=load().slice().sort((a,b)=>b.created.localeCompare(a.created));
    const n=k=>l.filter(t=>t.status===k).length;
    $('#rt-sum').textContent=`${l.length} ticket${l.length>1?'s':''} · ${n('todo')} à traiter · ${n('doing')} en cours · ${n('done')} fait${n('done')>1?'s':''}`;
    $('#rt-filters').innerHTML=[['all','Tous',l.length],...Object.entries(STATUS).map(([k,v])=>[k,v,n(k)])].map(([k,v,c])=>`<button type="button" data-f="${k}" aria-pressed="${filter===k}">${v} (${c})</button>`).join('');
    const shown=filter==='all'?l:l.filter(t=>t.status===filter);
    $('#rt-list').innerHTML=shown.length?shown.map(t=>`<article class="rt-card ${t.status==='done'?'done':''}" data-id="${t.id}">
      <div class="rt-l1"><span class="rt-num">${t.num==="…"?"Envoi…":esc(t.num)}</span><span>${fmt(t.created)}</span>${t.type?`<span class="rt-chip">${esc(t.type)}</span>`:''}<span>${esc(t.device||'')}</span></div>
      <div class="rt-l1"><span class="rt-pg">${esc(t.pageLabel||t.page)}</span>${t.where?`<span>· ${esc(t.where)}</span>`:''}</div>
      <p class="rt-desc">${esc(t.desc)}</p>
      <div class="rt-l3">
        <label class="rt-meta">Statut <select data-act="status">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}"${t.status===k?' selected':''}>${v}</option>`).join('')}</select></label>
        ${t.page!=='general'?`<button type="button" class="rt-btn ghost small" data-act="go">Aller à la page</button>`:''}
        <button type="button" class="rt-btn ghost small" data-act="edit">Modifier</button>
        <button type="button" class="rt-btn danger small" data-act="del">Supprimer</button>
      </div></article>`).join(''):`<p class="rt-empty">${l.length?'Aucun ticket avec ce statut.':'Aucun ticket pour le moment.<br>Utilisez le bouton « + » en bas à droite, depuis n\'importe quelle page.'}</p>`;
  }
  function openPanel(){ if(dlg.open) dlg.close(); pnl.showModal(); renderPanel(); renderSync(); refresh(); }
  function renderSync(){
    const el=document.getElementById('rt-sync'); if(!el) return;
    const wait=queue.filter(o=>o.op==='insert').length;
    el.className='rt-meta'+(sync.state==='err'?' rt-note rt-warn':'');
    el.textContent=sync.state==='busy'?'Synchronisation…':sync.state==='err'?sync.msg+(wait?` (${wait} en attente)`:''):sync.at?`Synchronisé avec la base à ${sync.at.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`+(wait?` · ${wait} en attente`:''):'';
  }
  $('#rt-close').addEventListener('click',()=>pnl.close());
  $('#rt-new').addEventListener('click',()=>openForm());
  $('#rt-filters').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(b){filter=b.dataset.f;renderPanel()}});
  $('#rt-list').addEventListener('change',e=>{
    if(e.target.dataset.act!=='status')return;
    updateTicket(e.target.closest('.rt-card').dataset.id,{status:e.target.value});renderPanel();
  });
  $('#rt-list').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
    const id=b.closest('.rt-card').dataset.id,l=load(),t=l.find(x=>x.id===id);if(!t)return;
    if(b.dataset.act==='go'){pnl.close();location.hash='#'+t.page}
    if(b.dataset.act==='edit') openForm(t);
    if(b.dataset.act==='del'&&confirm(`Supprimer le ticket ${t.num} ?`)){removeTicket(id);renderPanel()}
  });

  /* ---------- export et import ---------- */
  function asText(){
    const l=load().slice().sort((a,b)=>a.created.localeCompare(b.created));
    const head=`Retours sur le site de Maëlys Lainé\nExport du ${fmt(new Date().toISOString())} · ${l.length} ticket${l.length>1?'s':''}\n`;
    return head+l.map(t=>`\n${t.num} · ${fmt(t.created)} · ${STATUS[t.status]||t.status}\nPage : ${t.pageLabel||t.page}${t.where?`\nEndroit : ${t.where}`:''}${t.type?`\nType : ${t.type}`:''}\nAppareil : ${t.device||''}\n${t.desc}\n`).join('\n———');
  }
  const asJson=()=>JSON.stringify({app:'maelys-retours',version:1,exported:new Date().toISOString(),tickets:load()},null,2);
  const fileName=()=>`retours-site-maelys-${new Date().toISOString().slice(0,10)}.json`;
  function download(){
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([asJson()],{type:'application/json'}));a.download=fileName();
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
    toast('Fichier des retours téléchargé');
  }
  async function copy(){
    const txt=asText();
    try{await navigator.clipboard.writeText(txt);toast('Texte des retours copié')}
    catch(e){const ta=document.createElement('textarea');ta.value=txt;pnl.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Texte des retours copié')}catch(_){toast('Copie impossible ici : utilisez « Télécharger le fichier »')}ta.remove()}
  }
  $('#rt-ref').addEventListener('click',refresh);
  $('#rt-copy').addEventListener('click',copy);
  $('#rt-dl').addEventListener('click',download);
  $('#rt-imp').addEventListener('click',()=>$('#rt-file').click());
  $('#rt-file').addEventListener('change',async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    try{
      const data=JSON.parse(await f.text()), inc=Array.isArray(data)?data:data.tickets;
      if(!Array.isArray(inc)) throw 0;
      const ids=new Set(list.map(t=>t.id)); let added=0;
      inc.forEach(o=>{if(o&&o.desc&&!ids.has(o.id)){const st=o.status;createTicket({...o,id:isUuid(o.id)?o.id:null,status:'todo'});if(st&&st!=='todo')updateTicket(list[0].id,{status:st});added++}});
      renderPanel();toast(added?`${added} ticket${added>1?'s':''} importé${added>1?'s':''}`:'Aucun nouveau ticket dans ce fichier');
    }catch(_){toast("Ce fichier n'est pas un fichier de retours")}
  });

  /* ---------- onglet dans le menu ---------- */
  function addTabs(){
    const nav=$('#nav'); if(nav&&!nav.querySelector('.rt-tab')){const a=document.createElement('a');a.href='#';a.className='rt-tab';a.innerHTML='Retours<span class="rt-count"></span>';nav.appendChild(a)}
    const sn=$('#sheetNav'); if(sn&&!sn.querySelector('.rt-tab')){const a=document.createElement('a');a.href='#';a.className='rt-tab';a.innerHTML='<b></b><span>Retours<span class="rt-count"></span></span><small>Vos tickets d\'amélioration (relecture)</small>';const first=sn.querySelector('p');sn.insertBefore(a,first)}
    refreshCounts();
  }
  document.addEventListener('click',e=>{
    const a=e.target.closest('.rt-tab');if(!a)return;e.preventDefault();
    const close=$('#closeSheet'); if(document.getElementById('sheet')?.classList.contains('open')&&close) close.click();
    setTimeout(openPanel,a.closest('#sheetNav')?120:0);
  });
  function refreshCounts(){ try{
    const c=load().filter(t=>t.status!=='done').length||'';
    document.querySelectorAll('.rt-count').forEach(s=>s.textContent=c);
    const b=fab.querySelector('.rt-badge'); if(b) b.textContent=c;
  }catch(e){} }
  ['#nav','#sheetNav'].forEach(s=>{const el=$(s);if(el) new MutationObserver(addTabs).observe(el,{childList:true})});
  addTabs();
  addEventListener('online',refresh);
  refresh();
})();

</script>
</body>
</html>
