<style>
:root{
  /* Un magazine indépendant : couverture, sommaire, chapitres, journal. Photos d'abord, texte en marge, beaucoup de blanc. */
  --ivory:#F3EEE6; --beige:#E6DCCC; --stone:#675F56; --brown:#6B5747; --ink:#2B2622; --sage:#8D9A86; --line:#D8CEBF;
  --display:"Newsreader", "Iowan Old Style", Georgia, serif;
  --body:"Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --g:20px;
  color-scheme:light;
}
@media (min-width:900px){:root{--g:56px}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
body{margin:0;background:var(--ivory);color:var(--ink);font:400 16px/1.7 var(--body);-webkit-text-size-adjust:100%;padding-bottom:calc(52px + env(safe-area-inset-bottom))}
@media (min-width:900px){body{padding-bottom:0}}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:1.5px solid var(--brown);outline-offset:4px}
h1,h2,h3{font-family:var(--display);font-weight:300;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.01em}
em{font-style:italic}
p{margin:0 0 14px}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--g)}
.eyebrow{font-size:11px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--stone);margin:0 0 14px}
.folio{font-family:var(--display);font-style:italic;color:var(--stone)}
.todo{background:#EFE2BF;padding:0 .25em;border-bottom:1px dashed var(--brown)}
.draft{background:var(--ink);color:var(--ivory);font-size:12px;line-height:1.4;text-align:center;padding:8px 16px}

/* lien éditorial : pas de gros bouton */
.go{display:inline-flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;font-size:15px;font-weight:500;border-bottom:1px solid currentColor;padding:0 0 2px;line-height:1.2;align-self:flex-start}
.go::after{content:"→";transition:transform .3s ease}
.go:hover::after{transform:translateX(4px)}
.go.soft{color:var(--brown)}
.links{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:22px}

/* en-tête */
header{position:sticky;top:0;z-index:30;background:rgba(243,238,230,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{text-decoration:none;font-family:var(--display);font-style:italic;font-size:22px}
.nav{display:none}
.nav a{text-decoration:none;font-size:13px;letter-spacing:.06em;color:var(--stone);padding:6px 0;border-bottom:1px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--ink)}
.menu-btn{min-height:44px;background:none;border:0;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;padding:0 0 0 12px}
@media (min-width:980px){.nav{display:flex;gap:30px}.menu-btn{display:none}}

/* menu mobile : un sommaire */
.sheet{position:fixed;inset:0;z-index:50;background:var(--ivory);display:flex;flex-direction:column;padding:10px var(--g) calc(24px + env(safe-area-inset-bottom));opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s}
.sheet.open{opacity:1;visibility:visible}
.sheet-top{display:flex;justify-content:space-between;align-items:center;height:48px;margin-bottom:18px}
.sheet .eyebrow{margin-bottom:4px}
.sheet nav a{display:grid;grid-template-columns:34px 1fr;align-items:baseline;text-decoration:none;padding:9px 0;border-bottom:1px solid var(--line)}
.sheet nav a b{font-family:var(--display);font-style:italic;font-weight:300;color:var(--stone);font-size:15px}
.sheet nav a span{font-family:var(--display);font-size:30px;line-height:1.1}
.sheet nav a small{grid-column:2;font-size:13px;color:var(--stone)}
.sheet .foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}

/* ligne de contact discrète en bas (mobile) */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:6px var(--g) calc(6px + env(safe-area-inset-bottom));background:rgba(243,238,230,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);font-size:14px}
.dock span{color:var(--stone);font-family:var(--display);font-style:italic}
.dock .go{min-height:40px}
@media (min-width:900px){.dock{display:none}}

/* vues */
.view{animation:fade .5s ease}
@keyframes fade{from{opacity:.25}to{opacity:1}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(18px)}to{transform:none}}

/* cadres photo */
.ph{position:relative;margin:0;overflow:hidden;background:var(--beige)}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1),filter .6s ease;cursor:zoom-in}
@media (hover:hover){.ph:hover img{transform:scale(1.025)}}
.ph.empty{display:flex;align-items:center;justify-content:center;border:1px dashed #BDB1A0;background:repeating-linear-gradient(135deg,transparent 0 14px,rgba(107,87,71,.05) 14px 15px),var(--beige)}
.ph.empty span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--brown);text-align:center;padding:12px;max-width:24ch;line-height:1.5}
figcaption,.cap{font-size:12px;color:var(--stone);margin-top:8px;letter-spacing:.02em}
.r-34{aspect-ratio:3/4}.r-45{aspect-ratio:4/5}.r-23{aspect-ratio:2/3}.r-43{aspect-ratio:4/3}.r-32{aspect-ratio:3/2}.r-11{aspect-ratio:1}.r-169{aspect-ratio:16/9}

/* ====== COUVERTURE ====== */
.cover{padding-top:18px}
.cover-meta{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone);border-bottom:1px solid var(--ink);padding-bottom:10px}
.masthead{font-family:var(--display);font-weight:300;font-size:min(17.8vw,212px);line-height:.82;letter-spacing:-.035em;margin:14px 0 0;white-space:nowrap}
.masthead em{font-weight:300}
.cover-grid{display:grid;gap:22px;margin-top:-.08em;position:relative}
.cover-photo{aspect-ratio:4/5;max-height:78vh}
.cover-photo img{object-position:50% 70%}
.cover-side{display:flex;flex-direction:column;gap:18px}
.thesis{font-family:var(--display);font-size:clamp(28px,6.4vw,46px);line-height:1.08}
.thesis em{color:var(--brown)}
.intro{color:var(--stone);max-width:40ch;margin:0}
.toc{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--ink)}
.toc a{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:baseline;text-decoration:none;padding:10px 0;border-bottom:1px solid var(--line)}
.toc b{font-family:var(--display);font-style:italic;font-weight:300;color:var(--stone)}
.toc span{font-family:var(--display);font-size:21px;line-height:1.15}
.toc span i{color:var(--stone);font-size:16px}
.toc small{font-size:11px;color:var(--stone);letter-spacing:.1em}
@media (min-width:900px){
  .cover-grid{grid-template-columns:1.35fr 1fr;gap:56px;align-items:start}
  .cover-photo{aspect-ratio:auto;height:min(82vh,820px);max-height:none}
  .cover-side{padding-top:32px;position:sticky;top:90px}
}

/* sélection éditoriale */
.spread{padding-block:72px}
@media (min-width:900px){.spread{padding-block:120px}}
.sel{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;align-items:end}
.sel .a{grid-column:1/8}
.sel .b{grid-column:8/13;margin-bottom:22%}
.sel .c{grid-column:3/9;margin-top:12px}
.sel .t{grid-column:9/13;align-self:center;padding-left:6px}
@media (max-width:600px){.sel .c{grid-column:1/9}.sel .t{grid-column:1/13;padding:6px 0 0}}
.sel .t p{font-family:var(--display);font-size:20px;line-height:1.3;font-style:italic;color:var(--brown)}

/* double page citation */
.quote-spread{position:relative;color:#fff;margin:0}
.quote-spread .ph{height:min(92vh,760px);cursor:default}
.quote-spread img{object-position:center 50%;cursor:default}
.quote-spread::after{content:"";position:absolute;inset:0;background:rgba(40,40,46,.18);pointer-events:none}
.quote-spread .in{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:space-between;padding:36px var(--g) 32px;max-width:1240px;margin:0 auto}
.quote-spread blockquote{margin:0;font-family:var(--display);font-weight:300;font-size:clamp(30px,7vw,72px);line-height:1.04;max-width:16ch;text-shadow:0 1px 30px rgba(0,0,0,.18)}
.quote-spread p{align-self:flex-end;text-align:right;max-width:26ch;font-size:clamp(15px,3.8vw,19px);margin:0}

/* chapitres : liste éditoriale */
.chapters-list{border-top:1px solid var(--ink)}
.ch-row{display:grid;grid-template-columns:1fr 92px;gap:4px 16px;align-items:center;text-decoration:none;padding:16px 0;border-bottom:1px solid var(--line)}
.ch-row .ph{aspect-ratio:3/4;grid-column:2;grid-row:1/4}
.ch-row .num,.ch-row strong,.ch-row em{grid-column:1}
.ch-row b{display:block;font-family:var(--display);font-style:italic;font-weight:300;font-size:14px;color:var(--stone)}
.ch-row strong{display:block;font-family:var(--display);font-weight:300;font-size:clamp(30px,7vw,64px);line-height:1}
.ch-row em{font-family:var(--display);color:var(--brown);font-size:clamp(17px,3.6vw,24px)}
@media (min-width:900px){
  .ch-row{grid-template-columns:60px 1fr 1fr 110px;gap:28px;padding:22px 0}
  .ch-row .ph{grid-column:4;grid-row:1}
  .ch-row .num,.ch-row strong,.ch-row em{grid-row:1}
  .ch-row .num{grid-column:1}
  .ch-row strong{grid-column:2}
  .ch-row em{grid-column:3}
  .ch-row:hover strong{font-style:italic}
}
.sec-title{display:grid;gap:10px;margin-bottom:34px}
.sec-title h2{font-size:clamp(40px,10vw,96px)}
.sec-title p{color:var(--stone);max-width:48ch;margin:0}
@media (min-width:900px){.sec-title{grid-template-columns:1fr 1fr;align-items:end;gap:56px;margin-bottom:56px}}

/* bandeau invitation */
.invite{background:var(--beige);padding:64px 0}
.invite .wrap{display:grid;gap:16px}
.invite h2{font-size:clamp(34px,8vw,72px);max-width:16ch}
@media (min-width:900px){.invite{padding:110px 0}.invite .wrap{grid-template-columns:1.4fr 1fr;align-items:end}}

/* ====== CHAPITRE ====== */
.ch-cover{display:grid}
.ch-cover .ph{aspect-ratio:4/5;max-height:76vh}
.ch-head{padding:28px var(--g) 8px}
.ch-head .k{display:flex;gap:14px;align-items:baseline;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--stone)}
.ch-head .k b{font-family:var(--display);font-style:italic;font-weight:300;font-size:22px;letter-spacing:0;color:var(--brown);text-transform:none}
.ch-head h1{font-size:clamp(52px,14vw,150px);margin:10px 0 4px}
.ch-head .sub{font-family:var(--display);font-style:italic;font-size:clamp(22px,5vw,36px);color:var(--brown);margin:0}
@media (min-width:900px){
  .ch-cover{grid-template-columns:1fr 1fr;min-height:min(86vh,860px)}
  .ch-cover .ph{aspect-ratio:auto;max-height:none;order:2}
  .ch-head{display:flex;flex-direction:column;justify-content:flex-end;padding:56px var(--g) 64px}
}
.approach{padding:56px 0}
.approach .wrap{display:grid;gap:18px}
.approach .lede{font-family:var(--display);font-size:clamp(23px,5.2vw,34px);line-height:1.3;max-width:32ch}
.approach .body{color:var(--stone);max-width:56ch}
@media (min-width:900px){.approach{padding:110px 0}.approach .wrap{grid-template-columns:1fr 1.3fr;gap:80px}.approach .body{padding-top:10px}}

/* compositions de galerie */
.story{display:grid;gap:clamp(36px,7vw,110px);padding-bottom:clamp(48px,8vw,120px)}
.row-full .ph{max-height:88vh}
.row-full.bleed{margin:0 calc(-1 * var(--g))}
.row-duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.row-duo.stagger > :last-child{margin-top:22%}
.row-offset{display:grid;grid-template-columns:repeat(12,1fr)}
.row-offset > div{grid-column:4/13}
.row-offset.left > div{grid-column:1/10}
.row-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row-text{max-width:30ch;font-family:var(--display);font-style:italic;font-size:clamp(22px,4.6vw,32px);line-height:1.25;color:var(--brown);margin:0 auto;text-align:center}
.row-vert{display:grid;grid-template-columns:repeat(12,1fr);gap:12px;align-items:end}
.row-vert > figure{grid-column:1/8}
.row-vert > .note{grid-column:8/13;color:var(--stone);font-size:15px;padding-bottom:8px}
.row-vert.right > figure{grid-column:6/13;order:2}
.row-vert.right > .note{grid-column:1/6;order:1;text-align:right}
@media (max-width:600px){.row-vert > figure,.row-vert.right > figure{grid-column:1/11}.row-vert > .note,.row-vert.right > .note{grid-column:1/13;text-align:left;order:3}}

/* l'expérience */
.exp{border-top:1px solid var(--ink);padding:48px 0 64px}
.exp-grid{display:grid;gap:28px}
.exp h2{font-size:clamp(36px,8vw,64px)}
.exp ol{list-style:none;margin:0;padding:0;counter-reset:e}
.exp li{counter-increment:e;display:grid;grid-template-columns:36px 1fr;padding:12px 0;border-bottom:1px solid var(--line)}
.exp li::before{content:counter(e,upper-roman);font-family:var(--display);font-style:italic;color:var(--stone)}
.exp li span{color:var(--stone);font-size:15px}
.exp li strong{display:block;font-weight:500;color:var(--ink)}
.tarif{display:flex;flex-direction:column;gap:2px;margin:6px 0 0}
.tarif div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.tarif dt{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)}
.tarif dd{margin:0;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;text-align:right}
.variants{margin-top:18px;display:grid;gap:12px}
.variants p{margin:0;color:var(--stone);font-size:15px}
.variants strong{color:var(--ink);font-weight:500}
@media (min-width:900px){.exp{padding:80px 0 120px}.exp-grid{grid-template-columns:1fr 1fr 1fr;gap:56px}}
.next-ch{display:flex;justify-content:space-between;gap:16px;border-top:1px solid var(--line);padding:22px 0 40px}
.next-ch a{text-decoration:none}
.next-ch small{display:block;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--stone)}
.next-ch span{font-family:var(--display);font-size:clamp(22px,5vw,34px);font-style:italic}

/* ====== UNIVERS (sommaire) & JOURNAL ====== */
.page-head{padding:40px 0 30px}
.page-head h1{font-size:clamp(56px,15vw,170px);letter-spacing:-.03em}
.page-head p{color:var(--stone);max-width:46ch;margin:14px 0 0}
@media (min-width:900px){.page-head{padding:80px 0 50px}}
.issues{display:grid;gap:56px;padding-bottom:80px}
.issue{text-decoration:none;display:grid;gap:14px}
.issue .ph{aspect-ratio:4/3}
.issue h2{font-size:clamp(32px,7vw,58px)}
.issue p{color:var(--stone);margin:0;max-width:52ch}
@media (min-width:900px){.issues{grid-template-columns:1fr 1fr;gap:80px 56px}.issue:nth-child(even){margin-top:120px}}

.article-head{padding:36px 0 26px;text-align:center}
.article-head h1{font-size:clamp(46px,11vw,120px);max-width:14ch;margin:0 auto}
.article-head .dek{font-family:var(--display);font-style:italic;font-size:clamp(19px,4.4vw,26px);color:var(--brown);max-width:36ch;margin:16px auto 0}
.article-intro{max-width:62ch;margin:0 auto;padding:44px 0;color:var(--stone);font-size:17px}
.article-intro::first-letter{font-family:var(--display);float:left;font-size:4.2em;line-height:.8;padding:6px 10px 0 0;color:var(--ink)}
.article-end{text-align:center;border-top:1px solid var(--ink);padding:44px 0 72px}
.article-end p{font-family:var(--display);font-size:clamp(22px,5vw,32px);max-width:28ch;margin:0 auto 14px}

/* ====== TROUVER SA SÉANCE ====== */
.quiz{padding:24px 0 90px;max-width:1040px}
.q-progress{display:flex;gap:6px;margin:0 0 26px}
.q-progress i{flex:1;height:1px;background:var(--line)}
.q-progress i.on{background:var(--ink)}
.q-step h2{font-size:clamp(36px,8.4vw,72px);margin-bottom:8px}
.q-step .hint{color:var(--stone);margin-bottom:26px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:800px){.choices{grid-template-columns:repeat(3,1fr);gap:16px}}
.choice{display:flex;flex-direction:column;gap:10px;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.choice .ph{aspect-ratio:4/5;transition:outline-color .2s}
.choice .ph img{cursor:pointer}
.choice b{font-family:var(--display);font-weight:400;font-size:21px;line-height:1.1}
.choice small{display:block;font-size:13px;color:var(--stone);line-height:1.4}
.choice[aria-pressed="true"] .ph{outline:1.5px solid var(--ink);outline-offset:4px}
.choices.words{grid-template-columns:1fr}
@media (min-width:800px){.choices.words{grid-template-columns:repeat(3,1fr)}}
.choices.words .choice{border-top:1px solid var(--ink);padding:16px 0 4px;min-height:84px}
.choices.words .choice b{font-size:26px}
.q-nav{display:flex;justify-content:space-between;align-items:center;margin-top:30px}
.q-back{background:none;border:0;cursor:pointer;color:var(--stone);min-height:44px;padding:0;font-size:14px}
.result{display:grid;gap:26px}
.result h2{font-size:clamp(44px,11vw,104px)}
.result .sub{font-family:var(--display);font-style:italic;font-size:clamp(20px,4.6vw,30px);color:var(--brown);margin:0}
.result .trio{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.result .trio > :first-child{grid-row:span 2}
@media (min-width:900px){.result{grid-template-columns:1fr 1.1fr;gap:56px;align-items:start}}

/* ====== LA PHOTOGRAPHE ====== */
.bio{display:grid;gap:30px;padding:36px 0 70px}
.bio .portrait{aspect-ratio:4/5;max-height:76vh}
.bio h1{font-size:clamp(50px,13vw,140px);margin-bottom:20px}
.bio .text p{color:var(--stone);max-width:56ch}
.bio .text p.lead{font-family:var(--display);font-size:clamp(21px,4.6vw,28px);line-height:1.35;color:var(--ink)}
.signature{font-family:var(--display);font-style:italic;font-size:clamp(28px,6vw,44px);color:var(--brown);margin-top:22px;line-height:1.1}
@media (min-width:900px){.bio{grid-template-columns:.9fr 1.1fr;gap:90px;align-items:center;padding:70px 0 110px}}
.backstage{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;padding-bottom:30px}
.backstage > :first-child{grid-row:span 2}

/* ====== CONTACT ====== */
.contact{display:grid;gap:44px;padding:20px 0 80px}
@media (min-width:900px){.contact{grid-template-columns:1fr 1.15fr;gap:90px}}
.channels{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--ink)}

.p-next a.no-im{grid-template-columns:1fr;min-height:64px;border-bottom:1px solid var(--line)}

/* journal */
.j-list{display:grid;gap:56px;padding-bottom:90px}
.j-item{text-decoration:none;display:grid;gap:14px}
.j-item img{width:100%;height:auto;display:block}
.j-item h2{font-size:clamp(32px,7vw,56px)}
.j-item p{color:var(--stone);margin:0;max-width:56ch}
@media (min-width:900px){.j-item{grid-template-columns:1.3fr 1fr;gap:56px;align-items:end}}
.j-cover{margin:0}
.j-cover img{width:100%;height:auto;display:block;cursor:zoom-in}
.j-empty{max-width:52ch;color:var(--stone);padding-bottom:60px}

/* à propos */
.ab-text p{max-width:58ch;color:var(--ink);font-size:17px}
.ab-text p.lead{font-family:var(--display);font-size:clamp(22px,5vw,30px);line-height:1.35}
.ab-sec{border-top:1px solid var(--ink);padding:48px 0}
.ab-sec h2{font-size:clamp(30px,7vw,48px);margin-bottom:22px}
.ab-observe{list-style:none;margin:0;padding:0;display:grid;gap:0}
.ab-observe li{font-family:var(--display);font-size:clamp(22px,5vw,30px);line-height:1.25;padding:12px 0;border-bottom:1px solid var(--line)}
.ab-observe li em{color:var(--brown)}
@media (min-width:900px){.ab-sec{padding:90px 0}.ab-sec .wrap{display:grid;grid-template-columns:1fr 1.6fr;gap:80px}}
.ab-links{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:20px}

.no-draft .draft{display:none}
.p-price.long{font-size:clamp(38px,9.5vw,68px);line-height:1.05}

/* ===================== CONTACT (itération 5) ===================== */
.typo-tile{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-style:italic;font-size:64px;color:var(--brown);background:var(--beige)}
.c-intro{max-width:56ch}
.c-grid{display:grid;gap:48px;padding:8px 0 64px}
@media (min-width:900px){.c-grid{grid-template-columns:1.35fr 1fr;gap:80px;align-items:start;padding-bottom:100px}}
.c-req{font-size:14px;color:var(--stone);margin:-6px 0 0}
.field label .req{color:var(--brown)}
.f-hint{font-size:13px;color:var(--stone);margin:2px 0 0;line-height:1.45}
.f-err{font-size:14px;color:#9B2C1F;margin:4px 0 0;font-weight:500}
.f-err:empty{display:none}
.field input[aria-invalid="true"],.field select[aria-invalid="true"],.field textarea[aria-invalid="true"]{border-bottom-color:#9B2C1F;border-bottom-width:2px}
.field select{min-height:48px}
.hp{position:absolute!important;left:-10000px;width:1px;height:1px;overflow:hidden}
.c-privacy{font-size:14px;color:var(--stone);margin:0;max-width:60ch}
.c-ctx{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;background:var(--beige);padding:14px 16px;font-size:15px}
.c-ctx p{margin:0}
.c-ctx button{background:none;border:0;border-bottom:1px solid currentColor;cursor:pointer;font:500 14px var(--body);min-height:36px;padding:0;flex:0 0 auto}
.submit[disabled]{opacity:.6;cursor:progress}
.c-msg{font-size:15px;line-height:1.55}
.c-msg:empty{display:none}
.c-msg.ok,.c-msg.ko{padding:18px 20px;border:1px solid}
.c-msg.ok{border-color:#5E7A55;background:#EEF2EA}
.c-msg.ko{border-color:#9B2C1F;background:#FBF0EE}
.c-msg strong{display:block;font-family:var(--display);font-weight:400;font-size:24px;margin-bottom:6px}
.c-msg button{margin-top:10px;background:none;border:1px solid var(--ink);min-height:44px;padding:0 16px;cursor:pointer;font:500 14px var(--body)}
.c-side h2{font-size:clamp(28px,6vw,40px);margin-bottom:18px}
.c-steps{list-style:none;margin:0 0 28px;padding:0;counter-reset:c;border-top:1px solid var(--ink)}
.c-steps li{counter-increment:c;display:grid;grid-template-columns:32px 1fr;gap:2px 10px;padding:14px 0;border-bottom:1px solid var(--line)}
.c-steps li::before{content:counter(c);font-family:var(--display);font-style:italic;font-size:22px;color:var(--brown);grid-row:span 2}
.c-steps strong{font-weight:600}
.c-steps span{color:var(--stone);font-size:15px}
.c-steps a{color:var(--ink)}
.c-done{padding:28px 0}

/* ===================== FINITIONS (itération 6) ===================== */
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--ink);color:var(--ivory);padding:12px 18px;text-decoration:none;font-weight:600}
.skip:focus{top:12px}
h1.eyebrow{font-family:var(--body);font-weight:500;line-height:1.4}
h1.eyebrow span{color:var(--stone)}
footer .cols a{min-height:44px}
.sheet{overflow-y:auto}
.sheet nav a{min-height:44px}
@media (max-height:520px){.sheet nav a span{font-size:22px}.sheet nav a{padding:6px 0}}
.lb-stage img{max-height:calc(100dvh - 150px)}

/* ===== Version 7 : ouverture plein écran, respirations, emplacements à fournir ===== */
body{overflow-x:clip}
.h-hero.full{position:relative;display:block;min-height:calc(100svh - 58px - 52px - env(safe-area-inset-bottom));border-bottom:0;color:#fff;overflow:hidden}
@media (min-width:900px){.h-hero.full{min-height:calc(100svh - 58px)}}
.h-hero.full .h-photo{position:absolute;inset:0;height:auto;width:auto}
.h-hero.full .h-photo picture,.h-hero.full .h-photo img{width:100%;height:100%;object-fit:cover}
.h-hero.full::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(20,17,15,.30) 0%,rgba(20,17,15,0) 28%,rgba(20,17,15,0) 45%,rgba(20,17,15,.66) 100%)}
.h-over{position:absolute;left:var(--g);right:var(--g);bottom:clamp(28px,6vh,72px);z-index:2;display:flex;flex-direction:column;gap:12px;max-width:760px}
.h-hero.full .h-place{color:rgba(255,255,255,.9);margin:0}
.h-hero.full .h-name{color:#fff;font-size:clamp(54px,15vw,150px);text-shadow:0 2px 24px rgba(0,0,0,.18)}
.h-hero.full .h-name em{color:#F1E3D3}
.h-hero.full .h-phrase{color:#fff;max-width:20ch}
.h-hero.full .h-phrase em{color:#F1E3D3}
.h-hero.full .go,.h-hero.full .go.soft{color:#fff}
.h-hero.full .slot-tag{position:absolute;top:12px;left:12px;right:12px;z-index:3;margin:0}

/* portrait remonté juste après l'ouverture */
.h-person.first{padding:64px 0 72px}
.h-person p.t.lead{font-size:clamp(23px,5.6vw,32px);color:var(--ink)}
.h-person figure{position:relative}
.h-person figure .slot-tag{margin-top:10px}
@media (min-width:900px){.h-person.first{padding:120px 0}}

/* respirations : photo pleine largeur */
.h-breath{margin:0 0 clamp(56px,8vw,120px);position:relative;width:100%;height:min(78vh,62vw);min-height:300px;overflow:hidden;background:var(--beige)}
.h-breath img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
.h-breath .slot-tag{position:absolute;left:12px;right:12px;bottom:12px;margin:0}
.h-breath.empty{height:auto;min-height:0;background:none}
.p-g-full{width:100vw;margin-left:calc(50% - 50vw)}
.p-g-full img{width:100%;max-height:88vh;object-fit:cover}

/* emplacements à fournir (version de travail uniquement) */
.slot{display:grid;place-items:center;text-align:center;background:repeating-linear-gradient(135deg,#EFE6D8 0 14px,#EAE0CF 14px 28px);border:1.5px dashed var(--brown);color:var(--brown);padding:18px;font-size:13px;line-height:1.45}
.slot span{max-width:44ch}
.slot b,.slot-tag b{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:4px}
.slot.r-wide{height:clamp(220px,50vw,620px)}
.slot.r-45{aspect-ratio:4/5}
.slot.r-32{aspect-ratio:3/2}
.slot.r-note{margin-top:22px;padding:14px;place-items:start;text-align:left}
.p-g-full .slot.r-wide{border-left:0;border-right:0}
.slot-tag{background:#EFE2BF;color:var(--ink);border:1px dashed var(--brown);font-size:12px;line-height:1.4;padding:7px 10px;margin:8px 0 0}
.slot-tag.inline{margin-top:24px}
@media (max-width:899px){.p-g-duo .slot{font-size:11px;padding:10px}}

/* page Vos photos */
.vp{padding-bottom:clamp(64px,10vw,140px)}
.vp-body{max-width:640px}
.vp-body>p{font-family:var(--display);font-size:clamp(20px,4.8vw,26px);line-height:1.4}
@media (min-width:900px){.vp-body{margin-left:33%}}

/* liste des contenus à fournir */
.p-check.fournir{margin:0 auto 60px;max-width:1240px}
@media (min-width:900px){.p-check.fournir{width:calc(100% - 2 * var(--g))}}

/* ===== Effet « cartes qui s'empilent » (assets/cartes.js) ===== */
.cartes{overflow-x:clip;animation:none}
.carte{position:sticky;background:var(--ivory);overflow:clip}
.carte+.carte{border-radius:22px 22px 0 0;box-shadow:0 -14px 40px rgba(43,38,34,.12),0 -1px 0 rgba(43,38,34,.08)}
@media (min-width:900px){.carte+.carte{border-radius:28px 28px 0 0}}
.carte>.c-dim{position:absolute;inset:0;pointer-events:none;z-index:6;background:#2B2622;opacity:var(--dim,0)}
.carte.dessous{visibility:hidden}

/* ===== Animations au survol et au défilement (assets/anim.js) ===== */
/* ouverture : nom lettre par lettre, photo qui se pose */
.anim .h-hero.full .h-name .sp{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.anim .h-hero.full .h-name .si{display:inline-block;transform:translateY(105%);transition:transform 1s cubic-bezier(.2,.75,.15,1) calc(.25s + var(--d))}
.anim .h-hero.full.ouvert .h-name .si{transform:none}
.anim .h-hero.full .h-place,.anim .h-hero.full .h-phrase,.anim .h-hero.full .h-links{opacity:0;transform:translateY(16px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.75,.15,1)}
.anim .h-hero.full.ouvert .h-place{opacity:1;transform:none;transition-delay:.15s}
.anim .h-hero.full.ouvert .h-phrase{opacity:1;transform:none;transition-delay:.85s}
.anim .h-hero.full.ouvert .h-links{opacity:1;transform:none;transition-delay:1.05s}
.anim .h-hero.full .h-photo{animation:pose 2.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes pose{from{opacity:.4;filter:blur(6px)}to{opacity:1;filter:none}}
.h-hero.full .h-photo img,.h-breath img,.p-g-full img{will-change:transform}
.p-g-full figure{overflow:hidden}

/* titres : mot par mot */
.anim .split .sp{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.anim .split .si{display:inline-block}
.anim [data-in="mots"]:not(.mots) .si{transform:translateY(110%)}
.anim .mots .si{transform:none;transition:transform .9s cubic-bezier(.2,.75,.15,1) var(--d)}

/* photos : dévoilement en rideau */
.anim .rideau{clip-path:inset(0 0 0 0);transition:clip-path 1.2s cubic-bezier(.65,0,.25,1)}
.anim .rideau:not(.leve){clip-path:inset(100% 0 0 0)}
.anim .rideau img{transition:transform 1.6s cubic-bezier(.2,.7,.2,1),scale 1.6s cubic-bezier(.2,.7,.2,1)}
.anim .rideau:not(.leve) img{scale:1.18}
.anim .rideau.leve img{scale:1}

/* trait de lecture sous l'en-tête */
.lecture{position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brown);transform-origin:0 50%;transform:scaleX(0);pointer-events:none;z-index:2}


/* soulignements qui se redessinent au survol */
@media (hover:hover){
  .go{border-bottom:0;background:linear-gradient(currentColor,currentColor) 0 100%/100% 1px no-repeat;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
  .go:hover{animation:trait .75s cubic-bezier(.65,0,.25,1)}
  @keyframes trait{0%{background-position:100% 100%;background-size:100% 1px}45%{background-position:100% 100%;background-size:0 1px}46%{background-position:0 100%;background-size:0 1px}100%{background-position:0 100%;background-size:100% 1px}}
  .nav a{border-bottom:0;background:linear-gradient(currentColor,currentColor) 50% 100%/0 1px no-repeat;transition:background-size .45s cubic-bezier(.2,.7,.2,1),color .3s}
  .nav a:hover,.nav a[aria-current="page"]{background-size:100% 1px}
  .h-uni .im{transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .h-uni a strong{display:inline-block;transition:transform .5s cubic-bezier(.2,.7,.2,1)}
  .h-uni a:hover strong{transform:translateX(8px)}
  .p-gallery img,.h-sel img,.h-person img{transition:filter .5s ease}
  .p-gallery figure:hover img,.h-sel figure:hover img{filter:brightness(1.04) contrast(1.03)}
  .voir-on .p-gallery img,.voir-on .h-sel img,.voir-on .h-person img,.voir-on .h-breath img{cursor:none}
}
/* pastille « Voir » qui suit la souris */
.voir{position:fixed;left:0;top:0;z-index:90;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:rgba(251,248,242,.92);color:var(--ink);font:500 12px/1 var(--sans,inherit);letter-spacing:.14em;text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity .3s ease;box-shadow:0 8px 30px rgba(43,38,34,.18);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.voir.on{opacity:1}
@media (hover:none),(prefers-reduced-motion:reduce){.voir{display:none}}
.anim .h-name .mot{display:inline-block;white-space:nowrap}

</style>

/* Emplacements de photos à venir : complètent la galerie jusqu'à GALLERY_TARGET (version de travail) */
function gallerySlots(c){
  if(!WORKING) return "";
  let n=c.gallery.reduce((a,r)=>a+(r.img?1:(r.imgs||[]).length),0);
  const name=(c.kicker||"").toLowerCase(), out=[];
  const pattern=["full","duo","offset","duo","offset left","full"];
  let k=0;
  while(n<GALLERY_TARGET&&k<12){
    const kind=pattern[k%pattern.length];k++;
    if(kind==="full"){n++;out.push(`<div class="p-g-full">${slot(`Photo ${n} · ${name} · pleine largeur, format horizontal HD`,"r-wide")}</div>`)}
    else if(kind==="duo"){const a=++n,b=++n;out.push(`<div class="p-g-duo">${slot(`Photo ${a} · ${name} · verticale HD`,"r-45")}${slot(`Photo ${b} · ${name} · verticale HD`,"r-45")}</div>`)}
    else{n++;out.push(`<div class="p-g-offset${kind.includes("left")?" left":""}">${slot(`Photo ${n} · ${name} · horizontale ou verticale HD`,"r-32")}</div>`)}
  }
  return out.join("");
}

/* ---------- Trouver sa séance : 2 questions, facultatif ---------- */



let quiz={step:0,a:[]};
function renderQuiz(){
  const el=$('#quiz');if(!el)return;
  const prog=`<div class="q-progress">${[0,1].map(i=>`<i class="${i<=quiz.step?"on":""}"></i>`).join("")}</div>`;
  const tile=(p,l)=>p?fig(p):`<figure class="ph typo-tile r-45" aria-hidden="true"><span>${l==="Je ne sais pas encore"?"?":l.replace(/^(L'|Un |Une |Les |Notre |Nous, |Nous )/,"").charAt(0).toUpperCase()}</span></figure>`;
  if(quiz.step===0){
    el.innerHTML=`<h1 class="eyebrow">Trouver sa séance <span>· 1 / 2 · facultatif</span></h1>${prog}<div class="q-step"><h2>Quel moment souhaitez-vous <em>garder</em> ?</h2><p class="hint">Touchez celui qui vous correspond. Vous pouvez aussi <a href="#univers">voir toutes les séances</a>.</p>
    <div class="choices">${MOMENTS.map(([v,l,p])=>`<button type="button" class="choice" data-v="${v}">${tile(p,l)}<span><b>${l}</b><small>${uni(v)?uni(v).title:"Besoin d'être conseillé"}</small></span></button>`).join("")}</div></div>`;
  } else if(quiz.step===1){
    el.innerHTML=`<h1 class="eyebrow">Trouver sa séance <span>· 2 / 2</span></h1>${prog}<div class="q-step"><h2>Quand aimeriez-vous <em>la faire</em> ?</h2><p class="hint">Une indication suffit, rien n'est réservé à cette étape.</p>
    <div class="choices words">${WHEN.map(([v,l])=>`<button type="button" class="choice" data-v="${v}"><span><b>${l}</b></span></button>`).join("")}</div>
    <div class="q-nav"><button class="q-back" type="button" id="qBack">← Question précédente</button></div></div>`;
    $('#qBack').addEventListener('click',()=>{quiz.step=0;renderQuiz()});
  } else {
    const [m,wv]=quiz.a,u=uni(m),mom=MOMENTS.find(x=>x[0]===m),w=WHEN.find(x=>x[0]===wv);
    const type=u?u.title:TYPES[TYPES.length-1];
    const pg=u&&PAGES[u.id];
    const pics=u?[pg&&pg.cover,...galleryImages(u.id)].filter(p=>p&&!p.todo).slice(0,3):[];
    const answers=`${mom[1]} · ${w[1]}`;
    el.innerHTML=`<h1 class="eyebrow">Trouver sa séance <span>· votre résultat</span></h1>${prog}
    <div class="result">
      <div class="trio">${pics.length?pics.map((p,i)=>fig({...p,r:undefined},i?"r-11":"r-23")).join(""):`<figure class="ph typo-tile r-23" aria-hidden="true"><span>${u?u.title.charAt(0):"?"}</span></figure>`}</div>
      <div>
        <h2>${u?u.title:"Parlons-en"}</h2>${u?`<p class="sub">${u.sub}</p>`:""}
        <p style="margin-top:18px">${WHY[m]}</p>
        <p style="color:var(--stone)">Vos réponses : ${answers}. Elles seront reprises dans le formulaire, vous pourrez les modifier.</p>
        <div class="links">${u&&!hidden(u.id)?`<a class="go soft" href="#${u.id}">Découvrir la séance ${u.title.toLowerCase()}</a>`:`<a class="go soft" href="#univers">Voir toutes les séances</a>`}<a class="go" href="${contactHref({type,quiz:answers,when:wv!=="date"?w[1]:""})}" id="qContact" data-type="${type}" data-quiz="1" data-goto="form">Écrire avec mes réponses</a></div>
        <div class="q-nav"><button class="q-back" type="button" id="qRestart">↺ Recommencer</button></div>
      </div>
    </div>`;
    $('#qContact').addEventListener('click',()=>{ctx.quiz=answers;if(wv!=="date"){draft["f-when"]=w[1];saveDraft()}});
    enhance(el);
    $('#qRestart').addEventListener('click',()=>{quiz={step:0,a:[]};renderQuiz()});
    return;
  }
  el.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{quiz.a[quiz.step]=b.dataset.v;quiz.step++;renderQuiz();el.scrollIntoView({block:"start"});const h=el.querySelector('h2');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}));
}

/* ---------- Routeur ---------- */
let pendingType=null,pendingForm=false;
const ROUTES = () => ["accueil","univers","a-propos","vos-photos","contact","trouver","mentions","404",...(SHOW_JOURNAL||WORKING?["journal"]:[]),...Object.keys(PAGES).filter(id=>!hidden(id)),...JOURNAL.filter(a=>a.ready||WORKING).map(a=>a.id)];
function routeUrl(r){ return PATH_MODE ? (r==="accueil" ? BASE : `${BASE}${r}/`) : `#${r}`; }
function contactHref(o){
  if(!PATH_MODE) return "#contact";
  const q=new URLSearchParams();
  if(o.type)q.set("prestation",o.type);
  if(o.origin)q.set("origine",o.origin);
  if(o.quiz)q.set("questionnaire",o.quiz);
  if(o.when)q.set("periode",o.when);
  const s=q.toString();
  return `${BASE}contact/${s?"?"+s:""}${o.goto!==false?"#formulaire":""}`;
}
function currentRoute(){ return PATH_MODE ? window.SITE_PAGE : ((location.hash||"#accueil").slice(1)); }
function originOf(cur){ const art=JOURNAL.find(x=>x.id===cur); return PAGES[cur]?PAGES[cur].kicker:art?`reportage « ${art.title} »`:""; }
/* Liens internes, dimensions d'images : appliqués après chaque affichage */
function enhance(root){
  root.querySelectorAll('img').forEach(i=>{const k=(i.getAttribute('src')||"").replace(/^(\.\.\/|\/)+/,"");const d=IMGDIM[k];if(d&&!i.hasAttribute('width')){i.setAttribute('width',d[0]);i.setAttribute('height',d[1])}});
  if(!PATH_MODE) return;
  const cur=currentRoute();
  root.querySelectorAll('a[href^="#"]').forEach(a=>{
    const r=a.getAttribute('href').slice(1);
    if(r==="contact"&&(a.dataset.type||a.dataset.goto||a.dataset.quiz)){ if(!a.dataset.quiz) a.setAttribute('href',contactHref({type:a.dataset.type,origin:originOf(cur),goto:!!a.dataset.goto})); return; }
    if(r==="contenu") return;
    if(r==="accueil"||ROUTES().includes(r)) a.setAttribute('href',routeUrl(r));
  });
}
function route(){
  const ALIAS={photographe:"a-propos",apropos:"a-propos"};
  let h=currentRoute();if(ALIAS[h])h=ALIAS[h];
  if(!PATH_MODE&&(h==="contenu"||h==="formulaire"))return;
  if(hidden(h)) h=PATH_MODE?"404":"univers";
  let html,key=h;
  const art=JOURNAL.find(a=>a.id===h&&(a.ready||WORKING));
  if(PAGES[h]) {html=prestationView(h);key="univers"}
  else if(art) {html=articleView(art);key="journal"}
  else if(h==="journal"&&!SHOW_JOURNAL&&!WORKING) {h=PATH_MODE?"404":"accueil";html=VIEWS[h]();key=h}
  else if(VIEWS[h]) html=VIEWS[h]();
  else if(PATH_MODE) {h="404";html=VIEWS["404"]();key="404"}
  else {html=VIEWS.accueil();key="accueil";h="accueil"}
  if(h==="trouver") key="univers";
  app.innerHTML=`<div class="view">${html}</div>`;
  document.body.classList.toggle('is-home',key==="accueil");
  document.body.classList.toggle('no-draft',!WORKING||key==="accueil"||!!PAGES[h]||!!art||h==="a-propos");
  const m=META(h);
  if(!PATH_MODE){ document.title=m.title; const md=document.querySelector('meta[name="description"]'); if(md) md.content=m.desc; }
  document.querySelectorAll('#nav a').forEach(a=>{const r=a.dataset.r;if(r===key)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(!PATH_MODE) window.scrollTo(0,0);
  if(h==="trouver") renderQuiz();
  if(h==="contact"){
    if(PATH_MODE){
      const q=new URLSearchParams(location.search);
      if(q.get("prestation"))pendingType=q.get("prestation");
      ctx.origin=q.get("origine")||"";ctx.quiz=q.get("questionnaire")||"";
      if(q.get("periode")&&!draft["f-when"]){draft["f-when"]=q.get("periode")}
      pendingForm=location.hash==="#formulaire";
    }
    if(pendingType&&TYPES.includes(pendingType))draft["f-type"]=pendingType;
    wireForm();
    if(pendingForm) setTimeout(()=>{const t=$('#form');if(t){t.scrollIntoView({block:"start"});t.focus({preventScroll:true})}},60);
    pendingType=null;pendingForm=false;
  }
  enhance(app);
  reveal();
}
if(!PATH_MODE) addEventListener('hashchange',route);
/* Anciennes adresses (#famille) : redirection vers les vraies pages */
if(PATH_MODE&&window.SITE_PAGE==="accueil"&&location.hash.length>1){const r=location.hash.slice(1);if(ROUTES().includes(r)&&r!=="accueil")location.replace(routeUrl(r))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-scroll]');if(!b)return;const t=document.getElementById(b.dataset.scroll);if(!t)return;t.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});t.focus({preventScroll:true})});
document.addEventListener('click',e=>{
  if(PATH_MODE)return;
  const a=e.target.closest('a[href="#contact"]');if(!a)return;
  pendingType=a.dataset.type||null;pendingForm=!!a.dataset.goto;
  const cur=currentRoute();ctx.origin=originOf(cur);
  if(!a.dataset.quiz)ctx.quiz="";
  if(location.hash==="#contact"){e.preventDefault();route()}
});
/* Lien d'évitement */
document.addEventListener('click',e=>{const a=e.target.closest('a.skip');if(!a)return;e.preventDefault();app.setAttribute('tabindex','-1');app.focus();});

function wireForm(){
  const form=$('#contactForm');if(!form)return;
  const ids=["f-name","f-mail","f-type","f-msg","f-tel","f-when","f-place"];
  ids.forEach(id=>{const el=$('#'+id);if(draft[id])el.value=draft[id];el.addEventListener('input',()=>{draft[id]=el.value;saveDraft();if(el.getAttribute('aria-invalid')==="true")check(id)});el.addEventListener('change',()=>{draft[id]=el.value;saveDraft()})});
  renderCtx();
  const rules={
    "f-name":v=>v.trim().length>=2||"Indiquez votre prénom et votre nom.",
    "f-mail":v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())||"Indiquez une adresse e-mail valide, par exemple prenom@exemple.fr.",
    "f-type":v=>!!v||"Choisissez le type de projet, ou « Autre projet ».",
    "f-msg":v=>v.trim().length>=10||"Présentez votre projet en quelques mots (10 caractères minimum)."
  };
  function check(id){const el=$('#'+id),r=rules[id](el.value),err=$('#'+id+'-err');if(r===true){el.removeAttribute('aria-invalid');err.textContent="";return true}el.setAttribute('aria-invalid','true');err.textContent=r;return false}
  let sending=false;
  form.addEventListener('submit',async e=>{
    e.preventDefault();if(sending)return;
    const out=$('#formMsg');out.className="c-msg";out.innerHTML="";
    const bad=Object.keys(rules).filter(id=>!check(id));
    if(bad.length){out.textContent=bad.length===1?"Un champ est à corriger.":`${bad.length} champs sont à corriger.`;$('#'+bad[0]).focus();return}
    if($('#f-website').value){return}   // champ piège rempli : envoi ignoré (robot)
    const v=id=>$('#'+id).value.trim(),type=v("f-type"),name=v("f-name");
    const subject=type.startsWith("Autre")?`Demande de conseil — ${name}`:(type==="Mariage"||type==="Baptême"?`Demande ${type} — ${name}`:`Demande séance ${type} — ${name}`);
    const data={"_subject":subject,"Nom":name,"email":v("f-mail"),"Téléphone":v("f-tel")||"—","Prestation":type,"Date ou période":v("f-when")||"—","Lieu":v("f-place")||"—","Message":v("f-msg"),"Questionnaire":ctx.quiz||"—","Page d'origine":ctx.origin||"Contact","_gotcha":""};
    const btn=$('#f-send');sending=true;btn.disabled=true;btn.setAttribute('aria-busy','true');btn.textContent="Envoi en cours…";
    let ok=false,notConfigured=false;
    try{ok=await sendRequest(data)}catch(err){notConfigured=err&&err.notConfigured}
    sending=false;btn.disabled=false;btn.removeAttribute('aria-busy');btn.textContent="Envoyer ma demande";
    if(ok){
      draft={};saveDraft();ctx={origin:"",quiz:""};
      form.outerHTML=`<div class="c-msg ok c-done" role="status" tabindex="-1" id="formDone"><strong>Merci pour votre message.</strong>Votre demande a bien été envoyée. Je reviendrai vers vous pour en discuter. Cette demande ne réserve pas encore de date de séance.</div>`;
      $('#formDone').focus();return;
    }
    const em=CONTACT.email;
    const alt=em?`m'écrire directement à <a href="mailto:${em}">${em}</a>`:`m'écrire sur <a href="${IG}" target="_blank" rel="noopener">Instagram</a>`;
    out.className="c-msg ko";
    out.innerHTML=`<strong>Votre demande n'a pas été envoyée.</strong>${notConfigured?"L'envoi en ligne n'est pas encore activé sur cette version du site.":"L'envoi n'a pas abouti."} Vos informations sont conservées ci-dessus. Vous pouvez ${notConfigured?"":"réessayer, ou "}${alt}.<br><button type="button" id="copyReq">Copier ma demande</button>`;
    $('#copyReq').addEventListener('click',async()=>{const txt=`${subject}\n\nNom : ${name}\nE-mail : ${data.email}\nTéléphone : ${data["Téléphone"]}\nPrestation : ${type}\nDate ou période : ${data["Date ou période"]}\nLieu : ${data["Lieu"]}\nQuestionnaire : ${data["Questionnaire"]}\n\n${data["Message"]}`;try{await navigator.clipboard.writeText(txt);$('#copyReq').textContent="Demande copiée"}catch(_){$('#copyReq').textContent="Copie impossible : sélectionnez le texte du message"}});
    out.focus();
  });
}
async function sendRequest(data){
  if(CONTACT.provider==="formspree"&&CONTACT.formspreeId){
    const r=await fetch(`https://formspree.io/f/${encodeURIComponent(CONTACT.formspreeId)}`,{method:"POST",headers:{"Accept":"application/json","Content-Type":"application/json"},body:JSON.stringify(data)});
    return r.ok;
  }
  if(CONTACT.provider==="netlify"){
    const p=new URLSearchParams({"form-name":"contact","subject":data._subject,"bot-field":""});
    Object.entries(data).forEach(([k,v])=>{if(!k.startsWith("_"))p.append(k,v)});

<script>
/* =====================================================================
   EFFET « CARTES QUI S'EMPILENT » (au défilement, de haut en bas)
   Chaque section devient une carte. Arrivée au bout d'une section, elle reste
   en place et la suivante monte par-dessus, comme une carte posée sur la pile.
   La carte recouverte recule légèrement et s'assombrit.
   - Le défilement reste celui du navigateur (rien n'est bloqué).
   - Désactivé si « réduire les animations » est demandé sur l'appareil.
   - Pour retirer l'effet : supprimer la ligne <script src="assets/cartes.js"> de index.html.
   ===================================================================== */
(()=>{
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const app=document.getElementById('app'); if(!app) return;
  let view=null, cards=[], hs=[], sticks=[], hh=58, ticking=false;
  const ro=new ResizeObserver(()=>{measure();tick()});

  function build(){
    const v=app.querySelector('.view'); if(!v||v.dataset.cartes) return;
    v.dataset.cartes='1'; v.classList.add('cartes'); view=v; ro.disconnect();
    const kids=[...v.children].filter(e=>e.tagName!=='SCRIPT'&&e.tagName!=='TEMPLATE');
    // les blocs très courts (bandeau d'état, liste de travail…) rejoignent la carte suivante
    const groups=[]; let pend=[];
    kids.forEach((k,i)=>{pend.push(k); if(k.offsetHeight>=180||i===kids.length-1){groups.push(pend);pend=[]}});
    cards=groups.map((g,i)=>{
      const c=document.createElement('div'); c.className='carte';
      g[0].before(c); g.forEach(k=>c.appendChild(k));
      c.style.zIndex=String(i+1);
      c.insertAdjacentHTML('beforeend','<span class="c-dim" aria-hidden="true"></span>');
      ro.observe(c); return c;
    });
    measure(); tick();
  }
  function measure(){
    if(!cards.length) return;
    hh=(document.querySelector('header')||{}).offsetHeight||58;
    const H=innerHeight;
    hs=cards.map(c=>c.offsetHeight);
    sticks=hs.map(h=>Math.min(hh,H-h));          // une carte courte s'arrête sous l'en-tête, une longue quand son bas touche l'écran
    cards.forEach((c,i)=>{c.style.top=sticks[i]+'px'});
  }
  function frame(){
    ticking=false; if(!view||!cards.length||!view.isConnected) return;
    const vr=view.getBoundingClientRect();
    let y=vr.top; const tops=[];
    for(let i=0;i<cards.length;i++){ tops.push(Math.min(Math.max(y,sticks[i]),vr.bottom-hs[i])); y+=hs[i]; }
    for(let i=0;i<cards.length;i++){
      const A=cards[i], B=cards[i+1];
      if(!B){reset(A);continue}
      const aTop=tops[i], pivot=Math.max(aTop,hh), L=aTop+hs[i]-pivot, T=tops[i+1]-pivot;
      if(L<=1||T>=L){reset(A);continue}
      if(T<=0){A.classList.add('dessous');continue}   // entièrement recouverte
      A.classList.remove('dessous');
      const q=1-T/L;                                   // 0 → 1 pendant que la suivante la recouvre
      A.style.transformOrigin=`50% ${(pivot-aTop).toFixed(1)}px`;
      A.style.transform=`scale(${(1-q*.06).toFixed(4)})`;
      A.style.setProperty('--dim',(q*.38).toFixed(3));
    }
  }
  function reset(A){A.classList.remove('dessous');if(A.style.transform)A.style.transform='';A.style.setProperty('--dim',0)}
  function tick(){if(!ticking){ticking=true;requestAnimationFrame(frame)}}
  addEventListener('scroll',tick,{passive:true});
  addEventListener('resize',()=>{measure();tick()});
  new MutationObserver(build).observe(app,{childList:true});
  build();
})();

</script>
<script>
/* =====================================================================
   ANIMATIONS AU SURVOL ET AU DÉFILEMENT
   - Ouverture : le nom apparaît lettre par lettre, la photo se pose doucement.
   - Défilement : les photos se dévoilent comme un rideau, les titres montent
     mot par mot, les grandes photos glissent légèrement (parallaxe),
     un fin trait indique la progression de lecture.
   - Survol (ordinateur) : soulignements qui se redessinent, photos qui
     s'inclinent légèrement, pastille « Voir » qui suit la souris sur les photos
     qui s'agrandissent, boutons attirés par la souris.
   Tout est désactivé si l'appareil demande de réduire les animations.
   Pour retirer : supprimer la ligne <script src="assets/anim.js"> de index.html.
   ===================================================================== */
(()=>{
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const app=document.getElementById('app'); if(!app) return;
  const canHover=matchMedia('(hover: hover) and (pointer: fine)').matches;
  document.documentElement.classList.add('anim');

  /* ---------- découpe d'un texte en lettres ou en mots (le texte reste lisible tel quel) ---------- */
  function split(el,mode){
    let n=0;
    const walk=node=>{
      [...node.childNodes].forEach(c=>{
        if(c.nodeType===3){
          const frag=document.createDocumentFragment();
          const piece=(txt,into)=>{const o=document.createElement('span');o.className='sp';
            const i=document.createElement('span');i.className='si';i.textContent=txt;i.style.setProperty('--d',(n++)*(mode==='char'?.045:.07)+'s');
            o.appendChild(i);into.appendChild(o);};
          c.textContent.split(/(\s+)/).forEach(w=>{
            if(!w) return;
            if(/^\s+$/.test(w)){frag.appendChild(document.createTextNode(w));return}
            if(mode!=='char'){piece(w,frag);return}
            const mot=document.createElement('span');mot.className='mot';   // un mot ne se coupe jamais entre deux lettres
            [...w].forEach(ch=>piece(ch,mot)); frag.appendChild(mot);
          });
          node.replaceChild(frag,c);
        }else if(c.nodeType===1&&!c.classList.contains('sp')) walk(c);
      });
    };
    walk(el); el.classList.add('split');
  }

  /* ---------- apparitions au défilement ---------- */
  let io=null;
  function observe(el,cls){
    if(el.getBoundingClientRect().top<innerHeight*.92){el.classList.add(cls);return}
    io.observe(el);
  }
  function init(){
    const v=app.querySelector('.view'); if(!v||v.dataset.anim) return; v.dataset.anim='1';
    io&&io.disconnect();
    io=new IntersectionObserver(es=>es.forEach(en=>{
      if(!en.isIntersecting) return;
      const t=en.target; t.classList.add(t.dataset.in||'vu'); io.unobserve(t);
    }),{rootMargin:'0px 0px -10% 0px'});

    // ouverture de l'accueil
    const name=v.querySelector('.h-hero.full .h-name');
    if(name&&!name.classList.contains('split')){
      name.setAttribute('aria-label',name.textContent.trim());
      split(name,'char');
      name.querySelectorAll('.sp').forEach(s=>s.setAttribute('aria-hidden','true'));
      requestAnimationFrame(()=>v.querySelector('.h-hero.full').classList.add('ouvert'));
    }
    // titres : mot par mot
    v.querySelectorAll('h1:not(.h-name), h2').forEach(h=>{
      if(h.closest('.p-check,.sr,.slot')||h.classList.contains('split')) return;
      split(h,'word'); h.dataset.in='mots'; observe(h,'mots');
    });
    // photos : dévoilement en rideau
    v.querySelectorAll('.h-sel figure, .h-person figure, .p-gallery figure, .h-uni .im, .p-cover-photo, .h-breath, .j-cover, .ab-photo, .p-next .im').forEach(f=>{
      if(f.closest('.h-hero')) return;
      f.classList.add('rideau'); f.dataset.in='leve'; observe(f,'leve');
    });
    // grandes photos : parallaxe
    para=[...v.querySelectorAll('.h-breath img, .p-g-full img, .h-hero.full .h-photo img')];
    tick();
  }

  /* ---------- parallaxe, ouverture et trait de lecture (un seul calcul par image) ---------- */
  let para=[], ticking=false;
  const bar=document.createElement('span'); bar.className='lecture'; bar.setAttribute('aria-hidden','true');
  (document.querySelector('header')||document.body).appendChild(bar);
  function frame(){
    ticking=false; const H=innerHeight;
    para.forEach(img=>{
      const r=img.parentElement.getBoundingClientRect(); if(r.bottom<0||r.top>H) return;
      const hero=img.closest('.h-hero');
      const p=hero?Math.min(1,Math.max(0,-r.top/r.height)):((r.top+r.height/2)-H/2)/H;   // -0,5 → 0,5
      img.style.transform=hero?`translate3d(0,${(p*18).toFixed(2)}%,0) scale(1.06)`:`translate3d(0,${(p*-10).toFixed(2)}%,0) scale(1.14)`;
      if(hero){const o=hero.querySelector('.h-over'); if(o){o.style.transform=`translate3d(0,${(-p*60).toFixed(1)}px,0)`;o.style.opacity=(1-p*1.6).toFixed(3)}}
    });
    const max=document.documentElement.scrollHeight-H;
    bar.style.transform=`scaleX(${max>0?Math.min(1,scrollY/max).toFixed(4):0})`;
  }
  function tick(){if(!ticking){ticking=true;requestAnimationFrame(frame)}}
  addEventListener('scroll',tick,{passive:true}); addEventListener('resize',tick);
  new MutationObserver(()=>setTimeout(init,0)).observe(app,{childList:true});
  init();

  if(!canHover) return;

  /* ---------- survol : pastille « Voir » sur les photos qui s'agrandissent ---------- */
  const zoomSel='.h-sel img, .h-person img, .h-breath img, .p-gallery img, .j-cover img, .ph img';
  const skip='.choice,.ch-row,.issue,.quote-spread,.h-photo,.h-uni,.h-feature,.p-cover-photo,.p-next,.j-item';
  const dot=document.createElement('span'); dot.className='voir'; dot.textContent='Voir'; dot.setAttribute('aria-hidden','true');
  document.body.appendChild(dot);
  let mx=0,my=0,dx=0,dy=0,on=false,raf=0;
  const follow=()=>{dx+=(mx-dx)*.22;dy+=(my-dy)*.22;dot.style.transform=`translate3d(${dx}px,${dy}px,0) translate(-50%,-50%) scale(${on?1:.2})`;raf=(on||Math.abs(mx-dx)>.5)?requestAnimationFrame(follow):0};
  addEventListener('pointermove',e=>{
    mx=e.clientX;my=e.clientY;
    const t=e.target.closest&&e.target.closest(zoomSel);
    const yes=!!(t&&!t.closest(skip)&&!document.getElementById('lb')?.classList.contains('open'));
    if(yes!==on){on=yes;dot.classList.toggle('on',on);document.documentElement.classList.toggle('voir-on',on)}
    if(!raf) raf=requestAnimationFrame(follow);
  },{passive:true});

  /* ---------- survol : les vignettes des séances s'inclinent légèrement ---------- */
  app.addEventListener('pointermove',e=>{
    const im=e.target.closest&&e.target.closest('.h-uni .im'); if(!im) return;
    const r=im.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
    im.style.transform=`perspective(900px) rotateY(${(x*7).toFixed(2)}deg) rotateX(${(-y*7).toFixed(2)}deg)`;
  });
  app.addEventListener('pointerout',e=>{const im=e.target.closest&&e.target.closest('.h-uni .im'); if(im&&!im.contains(e.relatedTarget)) im.style.transform=''});

  /* ---------- survol : boutons principaux attirés par la souris ---------- */
  app.addEventListener('pointermove',e=>{
    const b=e.target.closest&&e.target.closest('.go.strong, .h-links .go, .h-contact .go, .p-cta .go'); if(!b) return;
    const r=b.getBoundingClientRect(), x=e.clientX-(r.left+r.width/2), y=e.clientY-(r.top+r.height/2);
    b.style.transform=`translate(${(x*.18).toFixed(1)}px,${(y*.3).toFixed(1)}px)`;
  });
  app.addEventListener('pointerout',e=>{const b=e.target.closest&&e.target.closest('.go'); if(b&&!b.contains(e.relatedTarget)) b.style.transform=''});
})();

</script>
<script>
/* =====================================================================
   OUTIL DE RETOURS — VERSION DE RELECTURE UNIQUEMENT
   Bouton « + » permanent pour créer un ticket d'amélioration,
   et onglet « Retours » qui garde l'historique des tickets.
   Les tickets sont enregistrés dans la base Supabase (table retours_site) :
   tout le monde voit la même liste, sans rien s'envoyer.
   Hors connexion, ils attendent dans le navigateur et partent au retour du réseau.
   Ce fichier n'est jamais inclus dans le site mis en ligne (node build.js le retire).
   ===================================================================== */
(()=>{
  const KEY='maelys-retours-v1';

  const TYPES=['Texte','Photo','Mise en page','Bug','Idée'];
  const NAMES={accueil:'Accueil',univers:'Univers (toutes les séances)','a-propos':'À propos','vos-photos':'Vos photos',contact:'Contact',trouver:'Trouver ma séance',mentions:'Mentions légales',journal:'Journal','404':'Page introuvable'};
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const $=s=>document.querySelector(s);

  /* ---------- réglages Supabase ----------
     La clé « publishable » est faite pour être visible dans un navigateur :
     ce sont les règles de sécurité de la table (RLS) qui limitent ce qu'elle permet.
     Ne jamais mettre ici une clé « secret » (sb_secret_…). */
  const SB_URL='https://zphtoekwgtkbnxgkybfj.supabase.co';
  const SB_KEY='sb_publishable_fWQsQBb9NmmV-h3gPoapQw_paToqSI1';
  const TABLE='retours_site';

  /* ---------- enregistrement ---------- */
  const CACHE='maelys-retours-cache', QUEUE='maelys-retours-attente', OLD='maelys-retours-v1';
  const ls={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
  let list=ls.get(CACHE,[]), queue=ls.get(QUEUE,[]), sync={state:'idle',msg:'',at:null};
  const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)}));
  const isUuid=s=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s||'');
  const fromRow=r=>({id:r.id,num:r.num?'R-'+String(r.num).padStart(3,'0'):'…',created:r.created_at,page:r.page,pageLabel:r.page_label,where:r.endroit||'',type:r.type||'',desc:r.description,device:r.appareil||'',status:r.statut||'todo'});
  const toRow=t=>({id:t.id,page:t.page,page_label:t.pageLabel||t.page,endroit:t.where||'',type:t.type||'',description:t.desc,appareil:t.device||''});
  const load=()=>list;
  const keep=()=>{ls.set(CACHE,list);ls.set(QUEUE,queue);refreshCounts()};
  async function api(path,opts={}){
    const r=await fetch(`${SB_URL}/rest/v1/${path}`,{...opts,headers:{apikey:SB_KEY,'Content-Type':'application/json',...(opts.headers||{})}});
    if(!r.ok){const txt=await r.text().catch(()=>'');const err=new Error(txt||r.statusText);err.status=r.status;throw err}
    const txt=await r.text(); return txt?JSON.parse(txt):null;   // un ajout réussi peut renvoyer une réponse vide
  }
  function explain(e){
    if(!navigator.onLine||e instanceof TypeError) return 'Pas de connexion : les tickets attendent dans ce navigateur et partiront au retour du réseau.';
    if(e.status===404||/42P01|does not exist|schema cache/.test(e.message)) return "La table « retours_site » n'existe pas encore dans Supabase : exécutez le script SQL fourni.";
    if(e.status===401||e.status===403) return "Supabase refuse l'accès : vérifiez la clé publique et les règles de la table.";

    while(queue.length){

        if(op.op==='insert'){try{await api(TABLE,{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify(op.row)})}catch(e){if(e.status!==409&&!/23505|duplicate/.test(e.message))throw e}}
        else await api(`${TABLE}?id=eq.${op.id}`,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify(op.patch)});
        queue.shift();keep();

      await flush();

      list=rows.map(fromRow);

    }catch(e){sync={state:'err',msg:explain(e),at:sync.at}}

  }
  function enqueue(op){queue.push(op);keep();refresh()}
  function createTicket(t){
    t.id=isUuid(t.id)?t.id:uuid(); t.num='…'; t.status=t.status||'todo';

    const t=list.find(x=>x.id===id); if(t) Object.assign(t,patch);
    const row={updated_at:new Date().toISOString()};
    if('status' in patch) row.statut=patch.status;
    if('desc' in patch) row.description=patch.desc;
    if('page' in patch){row.page=patch.page;row.page_label=patch.pageLabel}
